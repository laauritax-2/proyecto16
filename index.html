<!DOCTYPE html> <!-- Indica que el documento utiliza HTML5. -->
<html lang="es"> <!-- Establece el idioma español. -->
<head> <!-- Inicia la configuración de la página. -->
  <meta charset="UTF-8"> <!-- Permite mostrar tildes y caracteres especiales. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta la página a celulares. -->
  <title>Desplegable personalizado</title> <!-- Título que aparece en la pestaña. -->
  <link rel="stylesheet" href="style.css"> <!-- Conecta los estilos CSS. -->
</head> <!-- Termina la configuración. -->
<body> <!-- Inicia el contenido visible. -->
  <main class="contenedor"> <!-- Agrupa el contenido principal. -->
    <section class="panel"> <!-- Crea el panel donde está el desplegable. -->
      <p class="etiqueta">COMPONENTE INTERACTIVO</p> <!-- Texto pequeño de presentación. -->
      <h1>Elige una opción</h1> <!-- Título principal. -->
      <p class="descripcion">Selecciona un elemento de la lista para continuar.</p> <!-- Explica qué debe hacer el usuario. -->

      <div class="grupo-desplegable"> <!-- Agrupa el título y el menú. -->
        <label id="titulo-lista">Categoría</label> <!-- Nombre del campo desplegable. -->
        <div class="desplegable"> <!-- Contenedor del botón y las opciones. -->
          <button class="boton-desplegable" id="botonDesplegable" type="button"
            aria-haspopup="listbox" aria-expanded="false" aria-labelledby="titulo-lista textoBoton"> <!-- Botón que abre o cierra la lista. -->
            <span id="textoBoton">Selecciona una categoría</span> <!-- Texto inicial o elemento elegido. -->
            <span class="flecha" aria-hidden="true">⌄</span> <!-- Flecha decorativa del botón. -->
          </button> <!-- Termina el botón principal. -->

          <ul class="opciones" id="listaOpciones" role="listbox" aria-labelledby="titulo-lista" hidden> <!-- Lista de opciones, oculta al iniciar. -->
            <li><button type="button" class="opcion" role="option" data-valor="Diseño">Diseño</button></li> <!-- Primera opción. -->
            <li><button type="button" class="opcion" role="option" data-valor="Programación">Programación</button></li> <!-- Segunda opción. -->
            <li><button type="button" class="opcion" role="option" data-valor="Marketing">Marketing</button></li> <!-- Tercera opción. -->
            <li><button type="button" class="opcion" role="option" data-valor="Tecnología">Tecnología</button></li> <!-- Cuarta opción. -->
            <li><button type="button" class="opcion" role="option" data-valor="Educación">Educación</button></li> <!-- Quinta opción. -->
          </ul> <!-- Termina la lista de opciones. -->
        </div> <!-- Termina el contenedor del desplegable. -->
      </div> <!-- Termina el grupo del campo. -->

      <p class="mensaje" id="mensaje" aria-live="polite">Aún no has seleccionado una opción.</p> <!-- Informa la selección realizada. -->
    </section> <!-- Termina el panel. -->
  </main> <!-- Termina el contenido principal. -->
  <script src="script.js"></script> <!-- Conecta el código JavaScript. -->
</body> <!-- Termina el contenido visible. -->
</html> <!-- Termina el documento. -->
